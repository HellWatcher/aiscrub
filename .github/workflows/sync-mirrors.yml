name: Sync upstream mirrors

# Keeps the mirror/* branches current with the three upstream skills AIScrub
# merges. Runs daily and on demand.
#
# Why the mirrors are filtered snapshots rather than raw upstream commits:
# GITHUB_TOKEN can never create or update files under .github/workflows,
# no matter which `permissions:` are granted, and two of the upstreams ship
# their own workflow files. Pushing their commits verbatim was rejected with
# "refusing to allow a GitHub App to create or update workflow ... without
# `workflows` permission" every day from 2026-06-12 on. So each sync writes a
# snapshot commit of the upstream tree with .github/workflows removed and
# records the upstream SHA in an `Upstream-Commit:` trailer, which the next
# run reads to decide whether anything changed.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - upstream: blader/humanizer
            upstream_branch: main
            mirror: mirror/humanizer
          - upstream: hardikpandya/stop-slop
            upstream_branch: main
            mirror: mirror/stop-slop
          - upstream: conorbronsdon/avoid-ai-writing
            upstream_branch: main
            mirror: mirror/avoid-ai-writing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync ${{ matrix.upstream }} -> ${{ matrix.mirror }}
        env:
          UPSTREAM: ${{ matrix.upstream }}
          UPSTREAM_BRANCH: ${{ matrix.upstream_branch }}
          MIRROR: ${{ matrix.mirror }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch --no-tags --depth=1 upstream "${UPSTREAM_BRANCH}"
          new="$(git rev-parse FETCH_HEAD)"

          # Current mirror tip, if the branch exists yet.
          parent=""
          recorded=""
          if git fetch --no-tags --depth=1 origin "refs/heads/${MIRROR}:refs/remotes/origin/${MIRROR}" 2>/dev/null; then
            parent="$(git rev-parse "refs/remotes/origin/${MIRROR}")"
            recorded="$(git log -1 --format='%(trailers:key=Upstream-Commit,valueonly)' "$parent" | tr -d '[:space:]')"
          fi

          if [ "$recorded" = "$new" ]; then
            echo "${MIRROR} already matches upstream ${new}"
            exit 0
          fi

          # Build the snapshot tree: upstream tree minus .github/workflows.
          export GIT_INDEX_FILE="$(mktemp)"
          git read-tree "$new"
          git rm -r -q --cached --ignore-unmatch .github/workflows
          tree="$(git write-tree)"

          msg="$(printf 'Mirror %s@%s\n\nSnapshot of https://github.com/%s at %s with .github/workflows removed.\n\nUpstream-Commit: %s\n' \
            "${UPSTREAM}" "${new:0:12}" "${UPSTREAM}" "${new}" "${new}")"
          if [ -n "$parent" ]; then
            commit="$(git commit-tree "$tree" -p "$parent" -m "$msg")"
          else
            commit="$(git commit-tree "$tree" -m "$msg")"
          fi

          git push origin "${commit}:refs/heads/${MIRROR}" --force
          echo "${MIRROR} -> ${commit} (upstream ${new})"
